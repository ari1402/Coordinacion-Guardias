name: Mail de feedback post-guardia

on:
  schedule:
    - cron: '0 11 * * *' # 08:00 en Argentina (UTC-3). GitHub puede demorarlo unos minutos.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo mostrar a quién se mandaría (no manda ni escribe nada)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/send-feedback-mails.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
