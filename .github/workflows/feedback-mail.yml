name: Mail de feedback post-guardia

on:
  schedule:
    - cron: '0 11 * * *' # 08:00 en Argentina (UTC-3). GitHub puede demorarlo unos minutos.
  # Un push que toca este archivo manda solo un mail de prueba (no la corrida diaria).
  push:
    branches: [claude/guardias-firebase-webapp-0vgyas]
    paths: ['.github/workflows/feedback-mail.yml']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo mostrar a quién se mandaría (no manda ni escribe nada)'
        type: boolean
        default: true
      test_to:
        description: 'Mandar SOLO un mail de prueba a esta dirección (vacío = corrida normal)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/send-feedback-mails.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          TEST_TO: ${{ inputs.test_to || (github.event_name == 'push' && 'residente@example.com') || '' }}
