name: Recordatorio de feedback post-guardia

on:
  schedule:
    - cron: '0 11 * * *' # 08:00 en Argentina (UTC-3). GitHub puede demorarlo unos minutos.
  # Un push que toca este archivo manda solo un aviso de prueba (no la corrida
  # diaria) a quienes tienen tildado "Aviso del día 10" en Admin → Residentes.
  # Para repetir la prueba alcanza con cambiar el número de abajo.
  # prueba: 2
  push:
    branches: [claude/guardias-firebase-webapp-0vgyas]
    paths: ['.github/workflows/feedback-reminder.yml']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Solo mostrar a quién se avisaría (no manda ni escribe nada)'
        type: boolean
        default: true
      prueba:
        description: 'Mandar SOLO un aviso de prueba a quienes tienen tildado "Aviso del día 10"'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/feedback-reminders.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          TEST_AVISADAS: ${{ (github.event_name == 'push' || inputs.prueba) && 'true' || 'false' }}
