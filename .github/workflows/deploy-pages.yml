name: Deploy a GitHub Pages

on:
  push:
    branches:
      - main
      - claude/guardias-firebase-webapp-0vgyas
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Publica firestore.rules, corre migraciones pendientes y sincroniza los
      # feriados oficiales (este año y el siguiente) con la cuenta de
      # servicio del secret. Si el secret falta o está mal, avisa pero no frena
      # la app (las reglas se pueden publicar a mano con npm run deploy:rules).
      - name: Reglas de Firestore y migraciones
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::warning::Falta el secret FIREBASE_SERVICE_ACCOUNT: no se publicaron reglas ni migraciones. Ver README."
            exit 1
          fi
          node scripts/deploy-rules.mjs
          node scripts/migrate-v5.mjs
          node scripts/sync-holidays.mjs
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
